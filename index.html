<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(86,50,190,.32),
            transparent 30%

            circle at 90% 90%,
            rgba(0,105,180,.28),
            transparent 34%

    display:flex;

    justify-content:center;
    align-items:center;

    overflow-x:hidden;
}


/* =========================
   CENTER
========================= */

.wrapper{
    width:100%;
    min-height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:25px 18px;
}


/* =========================
   CARD
========================= */

.card{
    width:100%;
    max-width:455px;

    padding:50px 28px 28px;

    text-align:center;

    background:

        linear-gradient(
            145deg,
            rgba(35,32,67,.78),
            rgba(14,15,22,.94)
        );

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius:34px;

    box-shadow:

        0 25px 70px
        rgba(0,0,0,.60),

        inset 0 1px 0
        rgba(255,255,255,.05);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    position:relative;

    overflow:hidden;
}


/* TOP GLOW */

.card:before{
    content:"";

    position:absolute;

    width:220px;
    height:220px;

    top:-110px;
    left:50%;

    transform:translateX(-50%);

    background:
        rgba(91,69,255,.20);

    filter:blur(65px);

    border-radius:50%;

    pointer-events:none;
}


/* BOTTOM GLOW */

.card:after{
    content:"";

    position:absolute;

    width:250px;
    height:250px;

    right:-170px;
    bottom:-150px;

    background:
        rgba(0,130,220,.20);

    filter:blur(65px);

    border-radius:50%;

    pointer-events:none;
}


/* =========================
   DP
========================= */

.profile{
    width:118px;
    height:118px;

    margin:0 auto;

    padding:4px;

    border-radius:50%;

    background:

        linear-gradient(
            135deg,
            #6648ff,
            #896cff,
            #268cff
        );

    box-shadow:

        0 0 18px
        rgba(90,75,255,.80),

        0 0 38px
        rgba(65,110,255,.30);

    position:relative;

    z-index:2;
}

.profile img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    border-radius:50%;

    border:
        2px solid
        #090912;
}


/* =========================
   TITLE
========================= */

.title{
    margin-top:30px;

    font-size:34px;

    line-height:1.15;

    font-weight:800;

    letter-spacing:.2px;

    background:

        linear-gradient(
            90deg,
            #7770ff,
            #91a1ff,
            #7183ff
        );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    position:relative;

    z-index:2;
}


/* =========================
   BADGE
========================= */

.badge{
    display:inline-block;

    margin-top:16px;

    padding:9px 19px;

    border-radius:30px;

    border:

    font-size:13px;

    font-weight:700;

    z-index:2;
}


/* =========================

========================= */

.description{
    max-width:360px;

    margin:26px auto 0;

    color:#c5c4cd;

    font-size:15px;

    line-height:1.75;

    position:relative;

    z-index:2;
}


/* =========================
   JOIN BUTTON
========================= */

.join-btn{
    width:100%;

    height:62px;

    margin-top:28px;

    border:0;

    border-radius:17px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:14px;

    text-decoration:none;

    color:#fff;

    font-size:18px;

    font-weight:800;

    background:

        linear-gradient(
            100deg,
            #6944ff,
            #3d91ff
        );

    box-shadow:

        0 8px 25px
        rgba(75,80,255,.35),

        0 0 35px
        rgba(50,120,255,.15);

    position:relative;

    overflow:hidden;

    z-index:2;

    cursor:pointer;

    transition:
        transform .18s ease,
        opacity .18s ease;
}


/* SHINE */

.join-btn:after{
    content:"";

    position:absolute;

    width:65%;
    height:100%;

    left:-120%;
    top:0;

    background:

        linear-gradient(
            110deg,
            transparent,
            rgba(255,255,255,.40),
            transparent
        );

    transform:skewX(-20deg);

    animation:
        shine 2.7s infinite;

    pointer-events:none;
}

@keyframes shine{

    0%{
        left:-120%;
    }

    55%,100%{
        left:150%;
    }
}

.join-btn:active{
    transform:scale(.97);
}


/* TELEGRAM */

.telegram{
    width:25px;
    height:25px;

    fill:white;

    position:relative;

    z-index:2;
}

.join-text{
    position:relative;

    z-index:2;
}


/* =========================
   REDIRECT
========================= */

.redirect{
    margin-top:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:11px;

    color:#777684;

    font-size:13px;

    position:relative;

    z-index:2;
}

.loader{
    width:23px;
    height:23px;

    border-radius:50%;

    border:
        3px solid
        rgba(132,105,255,.18);

    border-top-color:#866cff;

    animation:

@keyframes spin{

/* =========================

<!-- =========================
     TRACKING + ANTI-BOT
========================= -->

<script>

(function(){

    "use strict";

    const button =
        document.getElementById("telegramJoin");

    const redirectText =
        document.getElementById("redirectText");


    /*
     * Basic client-side anti-automation checks.
     * This is NOT a 100% bot blocker.
     */

    const botSignals = [

        navigator.webdriver === true,

        !navigator.language,

        !navigator.userAgent,

        /HeadlessChrome/i.test(
            navigator.userAgent || ""
        ),

        /PhantomJS/i.test(
            navigator.userAgent || ""
        ),

        /Selenium/i.test(
            navigator.userAgent || ""
        )

    ];


    const suspicious =
        botSignals.some(Boolean);


    /*
     * Prevent repeated CTA events
     * during the same page session.
     */

    let tracked = false;


    /*
     * Track landing-page content view.
     */

    if(
        typeof window.fbq === "function" &&
        !suspicious
    ){

        fbq(
            'track',
            'ViewContent',
            {
                content_name:
                    'TARUN ARMY Landing Page',
                content_category:
                    'Telegram Community'
            }
        );

    }


    /*
     * Telegram CTA click
     */

    button.addEventListener(
        "click",
        function(){

            /*
             * Ignore obvious automation
             * and repeated clicks.
             */

            if(
                suspicious ||
                tracked
            ){

                if(suspicious){

                    redirectText.textContent =
                        "Please open this page normally.";

                }

                return;
            }


            tracked = true;


            /*
             * Standard Meta Lead event.
             *
             * This represents the actual
             * CTA interaction, not a confirmed
             * Telegram membership.
             */

            if(
                typeof window.fbq === "function"
            ){

                fbq(
                    'track',
                    'Lead',
                    {
                        content_name:
                            'Telegram Join CTA',
                        content_category:
                            'Telegram Community'
                    }
                );


                /*
                 * Subscribe event for the
                 * subscription/join CTA.
                 */

                fbq(
                    'track',
                    'Subscribe',
                    {
                        content_name:
                            'TARUN ARMY Telegram',
                        content_category:
                            'Telegram Community'
                    }
                );


                /*
                 * Custom event for analytics.
                 */

                fbq(
                    'trackCustom',
                    'TelegramJoinClick',
                    {
                        channel:
                            'TARUN ARMY'
                    }
                );

            }


            redirectText.textContent =
                "Opening Telegram...";


            /*
             * Give Pixel a short moment
             * before the external navigation.
             */

            setTimeout(
                function(){

                    /*
                     * The original <a> target="_blank"
                     * handles the Telegram opening.
                     */

                    redirectText.textContent =
                        "Redirecting you now...";

                },
                250
            );

        },
        {
            passive:true
        }
    );


})();

</script>
